<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../assets/media/dt-favicon.jpg" />
  <link rel="shortcut icon" href="../assets/media/dt-favicon.jpg" />
  <title>Kontakt — Dominic Thiem</title>
  <meta name="description" content="Kontaktseite der DT Sport GmbH." />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #171717;
      color: #fff;
      font-family: var(--dt-font-primary);
    }
    * { box-sizing: border-box; }
    a { color: inherit; }

    .dt-nav{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      background: transparent;
  border-bottom: 1px solid transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  transition: background-color .25s ease, border-color .25s ease, backdrop-filter .25s ease;
    }

    .dt-nav.is-scrolled{
  background: rgba(23,23,23,.96);
  border-bottom-color: rgba(255,255,255,.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.dt-nav__wrap{
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .dt-nav__logo{ display: inline-flex; align-items: center; }
    .dt-nav__logo img{
      width: 86px;
      height: auto;
      display: block;
      border-radius: 0 !important;
    }

    .dt-nav__menu{
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .dt-nav__menu > li{ position: relative; }

    .dt-nav__link,
    .dt-nav__trigger,
    .dt-nav__lang{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.92);
      text-decoration: none;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
      padding: 8px 0;
      border-bottom: 1px solid transparent;
      transition: border-color .18s ease, opacity .18s ease;
    }

.dt-nav__lang.is-active{
  opacity: .45;
  cursor: default;
  pointer-events: none;
  border-bottom-color: transparent !important;
}

    .dt-nav__lang{ opacity: .9; }

    .dt-nav__link:hover,
    .dt-nav__trigger:hover,
    .dt-nav__lang:hover,
    .dt-nav__link.is-active,
    .dt-nav__trigger.is-active{
      border-bottom-color: rgba(255,255,255,.92);
    }

    .dt-nav__arrow{
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-left: 7px;
  border-right: 2px solid rgba(255,255,255,.96);
  border-bottom: 2px solid rgba(255,255,255,.96);
  transform: translateY(-2px) rotate(45deg);
  opacity: .98;
}

    .dt-nav__dropdown{
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 272px;
  width: max-content;
      padding: 8px 0;
  background: rgba(23,23,23,.98);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 14px;
  box-shadow: 0 14px 36px rgba(0,0,0,.45);
      display: grid;
      gap: 4px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity .18s ease, visibility .18s ease, transform .18s ease;
    }

    .dt-nav__item--projects:hover .dt-nav__dropdown,
    .dt-nav__item--projects:focus-within .dt-nav__dropdown{
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dt-nav__dropdown a{
  color: rgba(255,255,255,.94);
  text-decoration: none;
  font-size: 16px;
  line-height: 1.2;
  padding: 12px 16px;
  border-radius: 10px;
  display: block;
  white-space: nowrap;
  font-weight: 400;
  opacity: .92;
  transition: background .16s ease, opacity .16s ease;
}

html,body{ color:var(--dt-secondary); text-size-adjust:100%; -webkit-text-size-adjust:100%; }
html{ -webkit-font-smoothing: antialiased; }
body{ font-family: var(--dt-font-primary); font-weight:var(--dt-weight-text); }
p{ font-family: var(--dt-font-primary); font-weight:400; }
h1,h2,h3,h4,h5,h6{ font-weight:var(--dt-weight-primary); }
strong,b{ font-weight:var(--dt-weight-accent); }
.dt-accent,[data-accent="true"]{ color:var(--dt-accent); font-weight:var(--dt-weight-accent); }

/* remove glow effects globally */
.dt-page::before,
.dt-projects::before,
.dt-bioCV::before,
.dt-partners::before,
.dt-store::before,
.dt-autograph::before,
.dt-umbrella::before{
  content:none !important;
  background:none !important;
}

.dt-page,
.dt-projects,
.dt-bioCV,
.dt-partners,
.dt-store,
.dt-autograph,
.dt-umbrella{
  background:transparent !important;
}

/* CONTACT LAYOUT */
.dt-page{
  min-height: 100vh;
}

.dt-contact{
  width: min(1120px, calc(100% - 48px));
  margin: 0 auto;
  padding: 150px 0 70px;
}

.dt-contact__title{
  margin: 0 0 10px;
  color: rgba(255,255,255,.92);
  font-size: clamp(28px, 3vw, 44px);
  font-weight: 400;
  line-height: 1.08;
}

.dt-contact__sub{
  margin: 0;
  color: rgba(255,255,255,.74);
  font-size: clamp(15px, 1.15vw, 18px);
  line-height: 1.7;
  font-weight: 400;
}

.dt-contact__formWrap{
  margin-top: 34px;
}

/* WPForms styling */
.dt-contact__formEmbed .wpforms-container{
  margin: 0 !important;
}

.dt-contact__formEmbed .wpforms-form{
  max-width: none !important;
  width: 100% !important;
}

.dt-contact__formEmbed .wpforms-field-container{
  display: grid !important;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-items: start;
  width: 100% !important;
}

.dt-contact__formEmbed .wpforms-field{
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  max-width: none !important;
}

.dt-contact__formEmbed .wpforms-one-half,
.dt-contact__formEmbed .wpforms-three-sixths,
.dt-contact__formEmbed .wpforms-two-fourths{
  width: 100% !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}

.dt-contact__formEmbed .wpforms-field-name{
  grid-column: 1;
  width: 100% !important;
}

.dt-contact__formEmbed .wpforms-field-email{
  grid-column: 2;
  width: 100% !important;
}

.dt-contact__formEmbed .wpforms-field-textarea{
  grid-column: 1 / -1;
}

.dt-contact__formEmbed .wpforms-field label{
  display: none !important;
}

.dt-contact__formEmbed .wpforms-field input,
.dt-contact__formEmbed .wpforms-field textarea{
  width: 100% !important;
  max-width: 100% !important;
  background: rgba(0,0,0,.18) !important;
  border: 1px solid rgba(255,255,255,.72) !important;
  border-radius: 8px !important;
  color: rgba(255,255,255,.92) !important;
  font-size: 15px !important;
  font-weight: 400 !important;
  line-height: 1.4 !important;
  box-shadow: none !important;
}

.dt-contact__formEmbed .wpforms-field input{
  height: 56px !important;
  padding: 0 18px !important;
}

.dt-contact__formEmbed .wpforms-field textarea{
  min-height: 180px !important;
  padding: 16px 18px !important;
  resize: vertical !important;
}

.dt-contact__formEmbed .wpforms-field input::placeholder,
.dt-contact__formEmbed .wpforms-field textarea::placeholder{
  color: rgba(255,255,255,.58) !important;
  opacity: 1 !important;
}

.dt-contact__formEmbed .wpforms-submit-container{
  margin-top: 16px !important;
  padding: 0 !important;
}

.dt-contact__formEmbed button.wpforms-submit,
.dt-contact__formEmbed .wpforms-submit{
  height: 44px !important;
  padding: 0 18px !important;
  border-radius: 999px !important;
  border: 1px solid rgba(255,255,255,.15) !important;
  background: #f2f2f2 !important;
  color: #111 !important;
  font-size: 14px !important;
  font-weight: 400 !important;
  line-height: 1 !important;
  box-shadow: none !important;
  transition: transform .15s ease, opacity .15s ease !important;
}

.dt-contact__formEmbed button.wpforms-submit:hover,
.dt-contact__formEmbed .wpforms-submit:hover{
  transform: translateY(-1px);
  opacity: .96;
}

@media (max-width: 960px){
  .dt-contact{
    width: min(1120px, calc(100% - 30px));
    padding-top: 136px;
  }

  .dt-contact__formEmbed .wpforms-field-container{
    grid-template-columns: 1fr !important;
  }

  .dt-contact__formEmbed .wpforms-field-name,
  .dt-contact__formEmbed .wpforms-field-email,
  .dt-contact__formEmbed .wpforms-field-textarea{
    grid-column: 1 !important;
  }
}

.dt-staticContact{display:grid;gap:16px;}
.dt-staticContact__row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.dt-staticContact input,.dt-staticContact textarea{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.68);background:rgba(0,0,0,.16);color:rgba(255,255,255,.92);font-size:15px;font-weight:400;line-height:1.4;box-shadow:none;}
.dt-staticContact input{height:56px;padding:0 16px;}
.dt-staticContact textarea{min-height:180px;padding:14px 16px;resize:vertical;}
.dt-staticContact button{height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.92);color:rgba(0,0,0,.92);font-size:14px;font-weight:400;cursor:pointer;width:max-content;}
 (max-width:960px){.dt-staticContact__row{grid-template-columns:1fr;}}
</style>

<script>
/* dt-nav-scroll-init */
(() => {
  const nav = document.querySelector(".dt-nav");
  if (!nav) return;
  const sync = () => nav.classList.toggle("is-scrolled", window.scrollY > 8);
  sync();
  window.addEventListener("scroll", sync, { passive: true });
})();
</script>
